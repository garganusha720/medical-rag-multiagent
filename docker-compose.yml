# =============================================
# Medical RAG Multi-Agent — Docker Compose
# =============================================
# 3 services: qdrant (vector DB), backend (FastAPI), frontend (Next.js)
#
# Usage:
#   Full stack:       docker-compose up --build
#   Backend only:     docker-compose up qdrant backend --build
#   Qdrant only:      docker-compose up qdrant
#
# Person A (AI/ML):  docker-compose up qdrant backend --build
# Person B (Frontend): docker-compose up --build

services:
  # ─── Qdrant Vector Database ──────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ─── FastAPI Backend (AI/ML Pipeline) ────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Qdrant to use Docker service name (internal DNS)
      - QDRANT_MODE=local
      - QDRANT_LOCAL_URL=http://qdrant:6333
    volumes:
      # Mount data directory for chunks, embeddings, corpus
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  # ─── Next.js Frontend ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
